<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state={ site:'rt', fx:['nausea'] }; }
  renderVals(){ const s=this.state; const sites=[['la','Left abdomen'],['ra','Right abdomen'],['lt','Left thigh'],['rt','Right thigh'],['lu','Left upper arm'],['ru','Right upper arm']];
    const fx=[['none','None'],['nausea','Nausea'],['fatigue','Fatigue'],['constipation','Constipation'],['headache','Headache'],['injsite','Injection-site reaction']];
    return { sites:sites.map(([k,l])=>({l, bg:s.site===k?'#eaf1fe':'#fff', bd:s.site===k?'#2e6fe8':'#e4e7ec', pick:()=>this.setState({site:k})})),
      fx:fx.map(([k,l])=>({l, on:s.fx.includes(k), bg:s.fx.includes(k)?'#2e6fe8':'#fff', fg:s.fx.includes(k)?'#fff':'#101828', bd:s.fx.includes(k)?'#2e6fe8':'#d0d5dd', pick:()=>this.setState({fx:s.fx.includes(k)?s.fx.filter(x=>x!==k):s.fx.concat([k])})})) }; }
}
</script>

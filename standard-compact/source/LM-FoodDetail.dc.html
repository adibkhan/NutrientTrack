<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state={ qty:1, unit:'bowl' }; }
  renderVals(){ const q=this.state.qty, base={k:590,p:46,c:61,f:18,fi:9};
    const r=x=>Math.round(x*q);
    return { qty:q.toFixed(q%1?1:0), kcal:r(base.k).toLocaleString(), p:r(base.p), c:r(base.c), f:r(base.f), fi:r(base.fi),
      dec:()=>this.setState({qty:Math.max(0.25,q-0.25)}), inc:()=>this.setState({qty:q+0.25}),
      pp:Math.round(base.p*4/base.k*100), pc:Math.round(base.c*4/base.k*100), pf:Math.round(base.f*9/base.k*100) }; }
}
</script>

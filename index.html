<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c111d" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme before first paint so a chosen light or dark theme never flashes the other one.
      try {
        var theme = localStorage.getItem('nutrienttrack-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (error) { /* storage unavailable: the system theme applies */ }
    </script>
    <meta name="description" content="A calm, local-first nutrition diary for seeing what your day is made of." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="./icons/nutrienttrack-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/nutrienttrack-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/ibm-plex-sans-latin.woff2" />
    <style>
      /* IBM Plex Sans (SIL OFL), self-hosted so the offline app never calls a font CDN. */
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("./fonts/ibm-plex-sans-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("./fonts/ibm-plex-sans-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <title>NutrientTrack · Your local nutrition diary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
